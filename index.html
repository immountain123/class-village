<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>클래스 빌리지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* VOICE: 따뜻하고 장난스러운 초등 교실, 말투는 이장 선생님
   IDEA: 우리 반이 곧 작은 도트 마을, 교사는 이장
   PICTURE: 화면 가득 걸어 다니는 탑다운 도트 마을
   COLOUR and TYPE: 보랏빛 밤색 #2a2533 바탕, 종이색 창, 풀색·코인색 강조 / Jua (배포 때 갈무리 도트 폰트로 교체)
   LAYOUT: 게임 화면 위에 도트 테두리 창, 교사용은 넓은 대시보드 */
:root{--bg:#2a2533;--edge:#1a1620;--paper:#f4e9d1;--paper2:#e8d9b8;--cream:#fff8e6;--ink:#2a2533;--grass:#6bbf59;--sky:#5dade2;--coin:#f5c542;--warn:#e05a47;--muted:#6f6479;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--paper);font:16px/1.5 'Galmuri11','Jua',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{user-select:none;-webkit-user-select:none}
input,textarea,select{font:inherit;font-size:16px;user-select:text;-webkit-user-select:text;color:var(--ink);background:#fffdf6;border:3px solid var(--edge);padding:8px 10px;border-radius:0;width:100%}
textarea{min-height:90px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
img{image-rendering:pixelated;object-fit:contain}
[hidden]{display:none!important}
h1,h2,h3,h4{font-weight:400;margin:0;line-height:1.2}
p{margin:0}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen{position:fixed;inset:0;display:none}
.screen.on{display:block}
.px{background:var(--paper);color:var(--ink);border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge)}
.btn{font:inherit;font-size:16px;background:var(--cream);color:var(--ink);border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge);padding:8px 16px;min-height:44px;cursor:pointer;border-radius:0;line-height:1.2;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn.sm{font-size:15px;padding:6px 12px;min-height:40px}
.btn.pri{background:var(--grass);color:#10260c}
.btn.coin{background:var(--coin)}
.btn.warn{background:var(--warn);color:#fff}
.btn.dark{background:var(--bg);color:var(--paper)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn img{width:20px;height:20px}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.tag{display:inline-block;background:var(--paper2);border:2px solid var(--edge);padding:1px 8px;font-size:14px;white-space:nowrap}
.tag.ok{background:#bfe8b4}
.tag.warn{background:#f6c0b6}
.tag.new{background:var(--coin)}
.help{color:var(--muted);font-size:15px;margin:10px 0}
.empty{color:var(--muted);text-align:center;padding:28px 8px}
/* title */
#sTitle{display:none;place-items:center;background:linear-gradient(rgba(42,37,51,.15),rgba(42,37,51,.55))}
#sTitle.on{display:grid}
.titlebox{text-align:center;padding:24px}
.logo{font-size:clamp(46px,9vw,96px);color:var(--coin);letter-spacing:2px;text-shadow:4px 4px 0 var(--edge),-3px 0 0 var(--edge),3px 0 0 var(--edge),0 -3px 0 var(--edge),6px 8px 0 rgba(26,22,32,.5)}
.sub{font-size:clamp(18px,2.6vw,24px);margin:10px 0 26px;color:var(--paper);text-shadow:2px 2px 0 var(--edge)}
.btn.big{font-size:22px;padding:12px 34px;min-height:56px}
.hint{margin-top:16px;color:var(--paper);text-shadow:2px 2px 0 var(--edge);animation:blink 1.4s steps(2) infinite}
.demo{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:14px;color:var(--paper);text-shadow:2px 2px 0 var(--edge)}
@keyframes blink{50%{opacity:.35}}
/* hud */
#sVillage{pointer-events:none}
#sVillage>*{pointer-events:auto}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;gap:8px;padding:10px 12px;pointer-events:none;flex-wrap:wrap}
#mini{position:absolute;right:12px;top:64px;z-index:6;border:3px solid #2a1d1a;border-radius:6px;background:#2a1d1a;image-rendering:pixelated;box-shadow:0 3px 0 rgba(0,0,0,.25);cursor:pointer;display:none}
body.village #mini{display:block}
body.village.tvw #mini{display:none}
body.inroom #mini,body.inroom #hotbar,body.inroom #hbName{display:none!important}
#roomBar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:6;display:none;gap:8px}
body.inroom #roomBar{display:flex}
#hud>div{display:flex;gap:8px;align-items:center;pointer-events:auto;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 6px;min-height:44px;font-size:17px}
.pill img{width:34px;height:34px;object-fit:contain}
.pill.coin b{font-weight:400;font-size:20px}
.pill.coin img{width:26px;height:26px}
#hTime{padding:4px 12px;font-size:15px}
#act{position:absolute;right:14px;bottom:16px;display:flex;gap:10px;align-items:flex-end}
#hotbar{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;background:#c8782e;border:4px solid #4a240c;border-radius:6px;box-shadow:inset 0 0 0 2px #eaa456,0 5px 0 rgba(0,0,0,.35);z-index:3}
#hotbar .hs{position:relative;width:50px;height:50px;background:#f6dca4;border:3px solid #8a4a1c;border-radius:4px;padding:0;display:grid;place-items:center;cursor:pointer;box-shadow:inset 2px 2px 0 #fff0c8,inset -2px -2px 0 #d8b070}
#hotbar .hs img{width:36px;height:36px;image-rendering:pixelated;pointer-events:none}
#hotbar .hs.on{border-color:#e8332a;box-shadow:0 0 0 3px #ffd84a,inset 2px 2px 0 #fff0c8}
#hotbar .hs .k{position:absolute;left:3px;top:0;font-size:11px;color:#6a3410;pointer-events:none}
#hotbar .hs .n{position:absolute;right:3px;bottom:0;font-size:13px;color:#fff;text-shadow:1px 0 #3a1a0a,-1px 0 #3a1a0a,0 1px #3a1a0a,0 -1px #3a1a0a;pointer-events:none}
#hotbar .hs .em{width:24px;height:24px;opacity:.25;background:#d8b070;border-radius:3px}
#hbName{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:#2a1418;color:#fff6dc;padding:4px 10px;border-radius:4px;font-size:14px;pointer-events:none;white-space:nowrap;z-index:3}
@media (max-width:880px){#hotbar{bottom:160px}#hotbar .hs{width:42px;height:42px}#hotbar .hs img{width:30px;height:30px}#hbName{bottom:226px}}
.abtn{font-size:20px;min-height:64px;padding:10px 22px}
#joy{position:absolute;left:18px;bottom:18px;width:136px;height:136px;border-radius:50%;background:rgba(26,22,32,.35);border:4px solid rgba(26,22,32,.75);touch-action:none;cursor:grab}
#joy::before{content:'';position:absolute;inset:18px;border-radius:50%;border:2px dashed rgba(244,233,209,.45)}
#joyK{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:var(--paper);border:4px solid var(--edge);box-shadow:0 4px 0 var(--edge);pointer-events:none}
#joy.on #joyK{background:var(--coin)}
#emotePop{position:absolute;right:14px;bottom:96px;width:min(340px,92vw);padding:12px}
#emotePop .emos{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
#emotePop .emos .btn{padding:4px;min-height:48px}
#emotePop .emos img{width:32px;height:32px}
#emotePop .phr{display:flex;flex-wrap:wrap;gap:6px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(20,16,26,.55);display:none;place-items:center;z-index:20;padding:12px}
#modal.on{display:grid}
.win{width:min(760px,96vw);max-height:90vh;display:flex;flex-direction:column}
.win.wide{width:min(1000px,96vw)}
.whead{background:var(--bg);color:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:6px 6px 6px 14px;gap:8px}
.whead h2{font-size:20px}
.whead .btn{min-height:38px}
.wbody{overflow:auto;padding:16px;overscroll-behavior:contain}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{font:inherit;font-size:15px;background:var(--cream);border:3px solid var(--edge);padding:6px 12px;min-height:40px;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--bg);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.item{background:var(--cream);border:3px solid var(--edge);padding:10px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.item b{font-weight:400}
.item.on{background:#fff0b8;outline:3px solid var(--coin)}
.ic{width:56px;height:56px}
.price{display:inline-flex;align-items:center;gap:4px}
.price img{width:18px;height:18px}
.card{background:var(--cream);border:3px solid var(--edge);padding:14px;margin-bottom:12px}
.card h4{font-size:20px;margin-bottom:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:15px;margin:8px 0}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta img{width:18px;height:18px}
.fb{background:#fde3d8;border:2px dashed var(--warn);padding:8px 10px;margin:8px 0}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.thumbs img{width:84px;height:84px;object-fit:cover;border:2px solid var(--edge);image-rendering:auto}
.field{display:grid;gap:4px;margin-bottom:10px}
.field>span{font-size:15px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.msg{color:var(--warn);min-height:24px;margin-top:6px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:44px;height:44px;border:3px solid var(--edge);cursor:pointer;padding:0}
.sw.on{outline:3px solid var(--coin);outline-offset:2px}
.crwrap{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:18px;align-items:start}
.crprev{background:#bfe6a8;border:3px solid var(--edge);display:flex;justify-content:center;gap:6px;padding:14px 6px}
.crprev img{width:44px;height:70px}
.crprev img.big{width:66px;height:105px}
.crrow{margin-bottom:12px}
.crrow>span{display:block;font-size:15px;color:var(--muted);margin-bottom:4px}
@media(max-width:560px){.crwrap{grid-template-columns:1fr}}
/* house */
.room{max-width:600px;margin:0 auto 12px;border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge)}
.rwall{height:52px;background-size:48px 48px;background-repeat:repeat;border-bottom:3px solid var(--edge)}
.rfloor{display:grid;background-size:48px 48px}
.cell{aspect-ratio:1;border:1px dashed rgba(26,22,32,.18);background:transparent;padding:0;display:grid;place-items:center;cursor:pointer}
div.cell{border-color:transparent;cursor:default}
.cell:hover{background:rgba(255,255,255,.25)}
.cell img{width:90%;height:90%}
.plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.plot{background:var(--cream);border:3px solid var(--edge);padding:10px;display:grid;gap:6px;justify-items:center;text-align:center}
.plot img{width:64px;height:64px}
.plot select{padding:6px}
.petbox{display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr);gap:16px;align-items:center}
.petbox img.big{width:140px;height:140px;background:#bfe6a8;border:3px solid var(--edge)}
.hearts{color:var(--warn);font-size:22px;letter-spacing:2px}
@media(max-width:560px){.petbox{grid-template-columns:1fr;justify-items:center}}
.log{width:100%;border-collapse:collapse;font-size:15px}
.log td{padding:6px 4px;border-bottom:2px dotted var(--paper2)}
.log td.n{text-align:right;white-space:nowrap}
.pos{color:#2f7a2a}.neg{color:var(--warn)}
.post{white-space:pre-wrap;background:#fffdf6;border:3px solid var(--edge);padding:14px;margin:10px 0;line-height:1.7}
.link{color:#2f5fb0}
/* dialog */
#dlg{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(820px,94vw);display:none;gap:12px;padding:12px;z-index:40;align-items:stretch}
#dlg.on{display:flex}
#dlg .por{width:84px;flex:none;background:var(--bg);border:3px solid var(--edge);display:grid;place-items:center}
#dlg .por img{width:52px;height:85px}
body.tv #hud{display:none}
#dlg .tx{flex:1;display:flex;flex-direction:column;gap:6px}
#dlg .nm{color:var(--muted);font-size:15px}
#dlgText{font-size:19px;min-height:58px;line-height:1.5}
#dlg .row{justify-content:flex-end}
/* toast, lock, rotate */
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:60;padding:8px 16px;display:none;font-size:17px;text-align:center;max-width:92vw}
#toast.on{display:block}
#lock{position:fixed;inset:0;background:rgba(26,22,32,.82);z-index:15;display:none;place-items:center;padding:16px}
#lock.on{display:grid}
.lockbox{padding:24px;text-align:center;max-width:460px;display:grid;gap:14px;justify-items:center}
.lockbox img{width:64px;height:80px}
.lockbox p{font-size:20px}
#rotate{position:fixed;inset:0;background:var(--bg);z-index:80;display:none;place-items:center;text-align:center;padding:24px;font-size:22px}
@media (orientation:portrait) and (max-width:760px){body.village #rotate{display:grid}}
#tvBar{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:10;padding:6px 8px 6px 16px;display:none;gap:12px;align-items:center}
#tvBar.on{display:flex}
/* teacher */
#sTeacher{background:var(--bg);overflow:auto;z-index:5}
.thead{position:sticky;top:0;z-index:3;background:var(--edge);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px max(3vw,12px);flex-wrap:wrap}
.tlogo{font-size:24px;color:var(--coin);font-weight:400}
#tClass{color:var(--paper);margin-left:8px}
.ttabs{display:flex;gap:6px;padding:14px max(3vw,12px) 0;max-width:1300px;margin:0 auto;flex-wrap:wrap}
.tbody{padding:14px max(3vw,12px) 60px;max-width:1300px;margin:0 auto;display:grid;gap:16px}
.panel{padding:16px}
.panel h3{font-size:21px;margin-bottom:10px}
.panel summary{cursor:pointer;font-size:19px;list-style:none}
.panel summary::before{content:'▸ '}
.panel[open] summary::before{content:'▾ '}
.panel[open] summary{margin-bottom:12px}
.praise{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.scard{font:inherit;color:var(--ink);background:var(--paper);border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge);padding:10px;display:grid;justify-items:center;gap:2px;cursor:pointer;text-align:center}
.scard.on{background:#fff0b8;outline:4px solid var(--coin);outline-offset:-1px}
.scard>img{width:44px;height:70px}
.scard.ghost>img{opacity:.35}
.scard .no{font-size:14px;color:var(--muted)}
.scard b{font-weight:400;font-size:18px}
.scard .nick{font-size:14px;color:var(--muted)}
.scard .cn{display:inline-flex;gap:4px;align-items:center;font-size:18px}
.scard .cn img{width:18px;height:18px}
.dot{font-size:13px;color:var(--muted)}
.dot.on{color:#2f7a2a}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-weight:400;color:var(--muted);border-bottom:3px solid var(--edge);padding:6px}
.tbl td{padding:8px 6px;border-bottom:2px dotted #cbbd9c;vertical-align:top}
.tbl td.r{text-align:right;white-space:nowrap}
.notice{background:#fff0b8;color:var(--ink);border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge);padding:10px 12px;display:grid;gap:8px}
.subrow{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) minmax(0,240px);gap:12px;padding:12px 0;border-bottom:2px dotted #cbbd9c;align-items:start}
@media(max-width:700px){.subrow{grid-template-columns:1fr}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.lcard{border:3px dashed var(--edge);padding:12px;background:#fffdf6;text-align:center}
.lcard b{display:block;font-size:22px;font-weight:400}
@media(prefers-reduced-motion:reduce){.hint{animation:none}}
</style>
</head>
<body>
<canvas id="cv" aria-label="클래스 빌리지 마을 화면"></canvas>

<section id="sTitle" class="screen on">
  <div class="titlebox">
    <h1 class="logo">클래스 빌리지</h1>
    <p class="sub">우리 반 도트 마을</p>
    <button class="btn pri big" data-a="start">시작하기</button>
    <p class="hint">아무 키나 눌러도 시작해요</p>
  </div>
  <p class="demo">선생님과 학생 모두 [시작하기]를 눌러 입장해요</p>
</section>

<section id="sVillage" class="screen">
  <div id="hud">
    <div>
      <div class="pill px"><img id="hAv" alt=""><span id="hNick"></span></div>
      <div class="pill px coin"><img id="hCoinIc" alt="코인"><b id="hCoin">0</b></div>
    </div>
    <div>
      <div class="pill px" id="hTime"></div>
      <button class="btn sm" data-a="nb" data-v="dex" id="hDex">도감</button>
      <button class="btn sm" data-a="nb" data-v="wear">수첩</button>
      <button class="btn sm" data-a="goHome">우리 집으로</button>
      <button class="btn sm" data-a="logout">나가기</button>
    </div>
  </div>
  <canvas id="mini" aria-label="미니맵 (누르면 크게 보기)" title="누르면 크게/작게"></canvas>
  <div id="joy" role="application" aria-label="캐릭터 이동 조이스틱"><div id="joyK"></div></div>
  <div id="roomBar"><button class="btn sm" data-a="roomMenu" id="bRoomMenu">집 꾸미기</button><button class="btn sm" data-a="roomOut">밖으로 나가기</button></div>
  <div id="hotbar" role="toolbar" aria-label="도구함" hidden></div><div id="hbName" hidden></div>
  <div id="act">
    <button class="btn sm" data-a="emote">이모티콘</button>
    <button class="btn pri abtn" data-a="interact" id="bA" hidden>들어가기</button>
  </div>
  <div id="emotePop" class="px" hidden></div>
</section>

<section id="sTeacher" class="screen">
  <header class="thead">
    <div><b class="tlogo">이장실</b><span id="tClass"></span></div>
    <div class="row wrap">
      <button class="btn sm" id="tLockBtn" data-a="tLock"></button>
      <button class="btn sm pri" data-a="tView">마을로 나가기</button>
      <button class="btn sm" data-a="logout">나가기</button>
    </div>
  </header>
  <nav class="ttabs" id="tTabs"></nav>
  <main class="tbody" id="tBody"></main>
</section>

<div id="tvBar" class="px"><b>선생님 산책 중</b><span id="tvInfo"></span><button class="btn sm" data-a="tvWhole" id="tvWholeBtn">전체 보기</button><button class="btn sm" data-a="tvBack">이장실로</button></div>

<div id="modal"><div id="win" class="win px" role="dialog" aria-modal="true" aria-labelledby="wTitle"><div class="whead"><h2 id="wTitle"></h2><button class="btn sm" data-a="close">닫기 ✕</button></div><div class="wbody" id="wBody"></div></div></div>

 tNickNo:v=>tact('nick',{no:+v,ok:false}),
 tPin:async v=>{ok(await tact('pin',{no:+v}),()=>{const s=S.students.find(x=>x.no===+v);if(s)toast(`${s.no}번 새 핀: ${s.pin}`)})},
 tDel:async v=>{const n=+v;if(TS.delArm!==n){TS.delArm=n;rT();return}TS.delArm=null;TS.sel.delete(n);ok(await tact('del_student',{no:n}),()=>toast('삭제했어요'))},
 tAddStu:async()=>{const no=+$('#nsNo').value,name=$('#nsName').value.trim();if(!no||!name){toast('번호와 이름을 적어 주세요');return}
  ok(await tact('add_student',{no,name}),()=>{const s=S.students.find(x=>x.no===no);toast(`${no}번 ${name} 추가 · 핀 ${s?s.pin:''}`)})},
 tCards:()=>openWin('cards','로그인 카드',b=>{b.innerHTML=`<p class="help" style="margin-top:0">잘라서 나눠 주세요. 학생 이메일이나 전화번호는 받지 않아요.</p><p style="margin-bottom:10px">접속 주소: <b>${esc(location.origin+location.pathname)}</b></p><div class="cards">${S.students.slice().sort((a,c)=>a.no-c.no).map(s=>`<div class="lcard"><span class="help">클래스 빌리지 · ${esc(S.cls.name)}</span><b>${s.no}번 ${esc(s.name)}</b><span>학급 코드 ${esc(S.cls.code)}</span><br><span>비밀 핀 <b style="display:inline">${esc(s.pin)}</b></span></div>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn" data-a="copyCards">텍스트로 복사</button></div>`},{wide:true}),
 copyCards:()=>copy(`접속 주소: ${location.origin+location.pathname}\n`+S.students.map(s=>`${s.no}번 ${s.name} / 학급 코드 ${S.cls.code} / 핀 ${s.pin}`).join('\n')),
 tAddPraise:()=>{const n=$('#npName').value.trim(),c=Math.round(+$('#npCoins').value||0);if(!n||c<1){toast('이름과 코인을 적어 주세요');return}tact('add_praise',{name:n,coins:c})},
 tDelPraise:v=>tact('del_praise',{id:v}),
 tAddMis:async()=>{const title=$('#mTitle').value.trim();if(!title){toast('미션 제목을 적어 주세요');return}
  ok(await tact('add_mission',{title,desc:$('#mDesc').value.trim(),due:$('#mDue').value,reward:Math.max(0,Math.round(+$('#mReward').value||0)),mode:$('#mMode').value,repeat:$('#mRep').value}),()=>toast('미션을 올렸어요'))},
 tDelMis:v=>tact('del_mission',{id:v}),
 tSubs:async v=>{const m=S.missions.find(x=>x.id===v);openWin('subs','제출물 · '+m.title,rSubs,{arg:v,wide:true});
  try{const r=await rpc('api_teacher',{p_token:TOKEN,p_act:'photos',p_args:{mid:v}});PHC[v]=r.photos||{};if(W.kind==='subs'&&W.arg===v)rerender()}catch(e){}},
 tSubOk:v=>tact('review',{sid:v,ok:true,fb:($('#fb_'+v)||{}).value||''}),
 tSubRetry:v=>tact('review',{sid:v,ok:false,fb:($('#fb_'+v)||{}).value||''}),
 tSubAll:async()=>{ok(await tact('review_all',{mid:W.arg}),r=>toast(`${r.count||0}건 승인했어요`))},
 tAddPost:async()=>{const title=$('#pTitle').value.trim(),body=$('#pBody').value.trim();if(!title||!body){toast('제목과 내용을 적어 주세요');return}const link=$('#pLink').value.trim();if(link&&!/^https?:\/\//.test(link)){toast('링크는 http로 시작해야 해요');return}
  ok(await tact('add_post',{title,tag:$('#pTag').value.trim(),body,link,from:$('#pFrom').value,to:$('#pTo').value,reward:Math.max(0,Math.round(+$('#pReward').value||0))}),()=>toast('도서관에 걸었어요'))},
 tDelPost:v=>tact('del_post',{id:v}),
 tRefl:v=>{const p=S.posts.find(x=>x.id===v);openWin('refl','소감 · '+p.title,rRefl,{arg:v,wide:true})},
 tFeat:v=>tact('feat',{id:v}),
 tUseCp:async v=>{const id=v.split(':')[1];ok(await tact('use_coupon',{id}),()=>toast('사용 처리했어요'))},
 tStock:v=>tact('stock',{id:v}),
 tDelCp:v=>tact('del_coupon',{id:v}),
 tAddCp:async()=>{const name=$('#cpName').value.trim();if(!name){toast('쿠폰 이름을 적어 주세요');return}
  ok(await tact('add_coupon',{name,price:Math.round(+$('#cpPrice').value||1),stock:Math.round(+$('#cpStock').value||1),limit:Math.round(+$('#cpLimit').value||1)}),()=>toast('쿠폰을 올렸어요'))},
 tSave:async()=>{const ph=$('#sPhr').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,16);
  ok(await tact('settings',{name:$('#sName').value.trim(),code:$('#sCode').value.trim().toUpperCase(),pw:$('#sPw').value,notice:$('#sNotice').value.trim(),
   set:{start:$('#sStart').value||'08:30',end:$('#sEnd').value||'16:00',limit:Math.round(+$('#sLimit').value||30),free:$('#sFree').checked,fast:$('#sFast').checked,live:$('#sLive').checked,tname:$('#sTname').value.trim(),tav:{skin:+$('#tvSkin').value,hs:+$('#tvHs').value,os:+$('#tvOs').value,hc:+$('#tvHc').value,top:$('#tvTop').value,gl:$('#tvGl').value==='1'}},phrases:ph}),()=>{store.set('cv_code',S.cls.code);toast('설정을 저장했어요')})},
 tCSV:()=>{const t=csv();openWin('csv','CSV 내보내기',b=>{b.innerHTML=`<p class="help" style="margin-top:0">아래 내용을 복사해 메모장에 붙여 넣고 .csv로 저장하면 엑셀에서 열 수 있어요.</p><textarea id="csvT" readonly style="min-height:260px;font-size:13px">${esc(t)}</textarea><div class="row" style="margin-top:10px"><button class="btn pri" data-a="copyCSV">전체 복사</button></div>`},{wide:true})},
 copyCSV:()=>copy($('#csvT').value,$('#csvT')),
 tYear:async()=>{const c=$('#yrc').value.trim();if(c!=='새 학년도'){toast("입력칸에 '새 학년도'라고 정확히 적어 주세요");return}TS.sel.clear();ok(await tact('year_reset',{confirm:c}),()=>toast('새 학년도 마을이 준비됐어요. 학생을 다시 등록해 주세요.'))}
};
function copy(text,ta){const done=()=>toast('복사했어요');try{navigator.clipboard.writeText(text).then(done,()=>{if(ta)ta.select();toast('길게 눌러 직접 복사해 주세요')})}catch(e){if(ta)ta.select();toast('길게 눌러 직접 복사해 주세요')}}

/* ===== events ===== */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(f){f(b.dataset.v,b,e);if(mode==='village'&&b.tagName==='BUTTON'&&!b.closest('#wBody'))b.blur()}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!['creator','setup'].includes(W.kind))closeWin()});
$('#dlg').addEventListener('click',e=>{if(!e.target.closest('button'))dlgNext()});
document.addEventListener('keydown',e=>{
 const k=e.key.length===1?e.key.toLowerCase():e.key,inField=/INPUT|TEXTAREA|SELECT/.test(document.activeElement&&document.activeElement.tagName);
 if(k==='Enter'&&inField&&document.activeElement.tagName==='INPUT'){const sc=document.activeElement.closest('.wbody,.panel,section,details');const btn=sc&&sc.querySelector('[data-enter]');if(btn){e.preventDefault();btn.click()}return}
 if(inField)return;
 if(k==='Escape'){if(modalOpen()&&!['creator','setup'].includes(W.kind))closeWin();closeEmote();return}
 if(dlgOn&&(k==='Enter'||k===' ')){e.preventDefault();dlgNext();return}
 if(mode==='title'&&!modalOpen()){e.preventDefault();A.start();return}
 if(mode==='village'||mode==='tview'){if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','w','a','s','d'].includes(k)){keys.add(k);e.preventDefault()}else if((k==='Enter'||k===' ')&&!modalOpen()){e.preventDefault();interact()}else if(/^[1-6]$/.test(k)&&mode==='village'&&ROLE==='student'&&!modalOpen()){hbSelect(+k-1)}}});
document.addEventListener('keyup',e=>{keys.delete(e.key.length===1?e.key.toLowerCase():e.key)});
window.addEventListener('blur',()=>keys.clear());
cv.addEventListener('pointerdown',e=>{if((mode!=='village'&&mode!=='tview')||lockOn||modalOpen())return;closeEmote();const wx=e.clientX/V.S+V.cx,wy=e.clientY/V.S+V.cy;
 if(ROOMV.on){if(ROOMV.fdir)return;const D=roomGeom();if(D&&wy>D.h-4&&Math.abs(wx-D.w/2)<20){P.target={x:D.w/2,y:D.h+16,then:leaveRoom};return}
  if(ROOMV.kind!=='house'){const m=bModel(ROOMV.kind),n=m.npc;if(n&&Math.abs(wx-n.x)<14&&wy<n.y+4&&wy>n.y-44){const ty=Math.min(D.h-10,(m.props.find(p=>!p.flat&&Math.abs(p.cx-n.x)<p.ws/2&&p.bot>n.y)||{bot:n.y+10}).bot+12);P.target={x:n.x,y:ty,then:talkNpc};return}}
  P.target={x:wx,y:wy+6};return}
 for(const d of doors)if(wx>=d.r[0]&&wx<d.r[2]&&wy>=d.r[1]-12&&wy<d.r[3]){P.target={x:d.x,y:d.y,then:()=>openDoor(d)};return}
 if(mode==='village'&&Math.hypot(wx-tori.x,wy-(tori.y-14))<14){P.target={x:tori.x,y:tori.y+12,then:toriTalk};return}
 for(const f of friends)if(Math.hypot(wx-f.x,wy-(f.y-14))<14){P.target={x:f.x+12,y:f.y,then:()=>greet(f)};return}
 P.target={x:wx,y:wy+6}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='village')flushUsage()});
window.addEventListener('pagehide',()=>{if(mode==='village')flushUsage()});

/* ===== joystick ===== */
(()=>{const j=$('#joy'),k=$('#joyK'),R=48;
 const setK=(dx,dy)=>{k.style.transform=`translate(${dx}px,${dy}px)`};
 const mv=e=>{const r=j.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const d=Math.hypot(dx,dy);if(d>R){dx=dx/d*R;dy=dy/d*R}setK(dx,dy);const m=Math.hypot(dx,dy)/R;JOY.x=m>.22?dx/R:0;JOY.y=m>.22?dy/R:0};
 const end=e=>{if(!JOY.on||(e&&e.pointerId!==JOY.id))return;JOY.on=false;JOY.x=JOY.y=0;JOY.id=null;j.classList.remove('on');setK(0,0)};
 j.addEventListener('pointerdown',e=>{if((mode!=='village'&&mode!=='tview')||lockOn||modalOpen())return;e.preventDefault();JOY.on=true;JOY.id=e.pointerId;j.classList.add('on');try{j.setPointerCapture(e.pointerId)}catch(x){}P.target=null;closeEmote();mv(e)});
 j.addEventListener('pointermove',e=>{if(JOY.on&&e.pointerId===JOY.id)mv(e)});
 j.addEventListener('pointerup',end);j.addEventListener('pointercancel',end);j.addEventListener('lostpointercapture',end);
 window.addEventListener('blur',()=>end())})();

/* ===== boot ===== */
for(const k in ASSET_FILES){const im=new Image();im.onload=()=>{IMG[k]=im;for(const c in CACHE)delete CACHE[c];for(const u in URLC)delete URLC[u];if(mapC)renderMap()};im.src=ASSET_FILES[k]}
$('#mini').addEventListener('click',e=>{e.stopPropagation();MINI.big=!MINI.big});
buildMap();renderMap();
requestAnimationFrame(loop);
if(document.fonts&&document.fonts.load)document.fonts.load('16px Jua').catch(()=>{});
}
</script>
